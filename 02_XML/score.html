<!DOCTYPE html>
<html lang="es">

    <head>
        <meta charset="UTF-8">
        <title>Ranking de jugadores</title>
    </head>

    <body style="background-color: #FADADD; font-family: 'Times New Roman';">

        <!-- Título -->
        <h2 style="text-align: center; color: #E75480; font-size: 24px;">Ranking de jugadores</h2>

        <!-- Tabla centrada con borde fucsia -->
        <table style="margin: auto; border-collapse: collapse; border: 3px solid #FF1493; text-align: center; color: black;">

            <!-- Cabecera -->
            <tr style="background-color: white;">
                <th style="border: 3px solid #FF1493; padding: 8px 20px;">Posición</th>
                <th style="border: 3px solid #FF1493; padding: 8px 20px;">Nombre</th>
                <th style="border: 3px solid #FF1493; padding: 8px 20px;">Puntos</th>
            </tr>

            <!-- 1º puesto en dorado -->
            <tr style="background-color: gold;">
                <td style="border: 3px solid #FF1493; padding: 8px 20px;">1</td>
                <td style="border: 3px solid #FF1493; padding: 8px 20px;">Jaime</td>
                <td style="border: 3px solid #FF1493; padding: 8px 20px;">500</td>
            </tr>

            <!-- 2º puesto en rosa -->
            <tr style="background-color: #FFC0CB;">
                <td style="border: 3px solid #FF1493; padding: 8px 20px;">2</td>
                <td style="border: 3px solid #FF1493; padding: 8px 20px;">Maite</td>
                <td style="border: 3px solid #FF1493; padding: 8px 20px;">350</td>
            </tr>

            <!-- 3º puesto en blanco -->
            <tr style="background-color: white;">
                <td style="border: 3px solid #FF1493; padding: 8px 20px;">3</td>
                <td style="border: 3px solid #FF1493; padding: 8px 20px;">Juan</td>
                <td style="border: 3px solid #FF1493; padding: 8px 20px;">100</td>
            </tr>

        </table>

    </body>

</html>
